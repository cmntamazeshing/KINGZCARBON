<script>
/**
 * 🛠️ KINGZCARBON 前端動態數據庫
 * Shing 你可以直接修改這裡的數據，隨時更換圖片、影片或文案說明：
 * - type: 可填入 'image' 或 'video'
 * - url: 檔案的高清完整網址
 */
const bodyKitsDatabase = [
    {
        type: 'image',
        url: 'https://i.imgur.com/DNeHanC.png',
        title: 'Carbon Fiber Front Lip Splitter Profile',
        desc: 'Vacuum infused 2x2 twill carbon fiber front splitter designed for sharp downforce management and precise lower chassis edge refinement.'
    },
    {
        type: 'image',
        url: 'https://i.imgur.com/pDM1hYH.png',
        title: 'Handcrafted Performance Rear Diffuser',
        desc: 'Aggressive multi-finned rear diffuser variant engineered to control rear underbody airflow while framing exhaust channels perfectly.'
    },
    {
        type: 'video',
        url: 'https://www.w3schools.com/html/mov_bbb.mp4', // 這裡暫用範例 mp4，將來可更換為你的外觀件高清動態影片網址
        title: 'Dry Carbon Aerodynamic Wing Demonstration',
        desc: 'Real-world fluid dynamic rendering and motion showcase of our ultra-lightweight, high-downforce custom wing structure.'
    },
    {
        type: 'image',
        url: 'https://i.imgur.com/pDM1hYH.png',
        title: 'Aggressive Carbon Side Skirt Extensions',
        desc: 'Low-profile side panel skirts crafted to lower the vehicle’s visual center of gravity while optimizing lateral wind stability.'
    },
    {
        type: 'image',
        url: 'https://i.imgur.com/DNeHanC.png',
        title: 'Replacement Carbon Fiber Mirror Covers',
        desc: 'A pair of elite featherweight side mirror housings utilizing specialized weave continuity alignment for an instantaneous exterior pop.'
    },
    {
        type: 'image',
        url: 'https://i.imgur.com/pDM1hYH.png',
        title: 'Bespoke Ventilated Carbon Bonnet / Hood',
        desc: 'A complete replacement hood system featuring raw exposed carbon fiber internal structures and aggressive thermal extraction vents.'
    }
];

// 核心切換邏輯
function switchViewer(index, thumbElement) {
    const data = bodyKitsDatabase[index];
    if (!data) return;

    // 1. 更新小圖的選中邊框樣式 (Active State)
    const allThumbs = document.querySelectorAll('.paddle-thumb');
    allThumbs.forEach(thumb => thumb.classList.remove('active-thumb'));
    if (thumbElement) {
        thumbElement.classList.add('active-thumb');
    }

    // 2. 獲取大圖與影片元件
    const imgElement = document.getElementById('main-view-img');
    const videoElement = document.getElementById('main-view-video');
    const titleElement = document.getElementById('main-view-title');
    const descElement = document.getElementById('main-view-desc');

    // 3. 根據類型執行顯隱與數據加載
    if (data.type === 'video') {
        imgElement.classList.add('hidden');
        imgElement.src = "";
        
        videoElement.src = data.url;
        videoElement.classList.remove('hidden');
        videoElement.load();
        videoElement.play().catch(e => console.log("Autoplay blocked or video loaded: ", e));
    } else {
        videoElement.classList.add('hidden');
        videoElement.pause();
        videoElement.src = "";
        
        imgElement.src = data.url;
        imgElement.classList.remove('hidden');
    }

    // 4. 刷新標題與描述文案
    titleElement.innerText = data.title;
    descElement.innerText = data.desc;
}

// 首次加載時預設觸發第 0 個樣板 (即第一個前唇項目)
window.onload = function() {
    switchViewer(0, document.querySelectorAll('.paddle-thumb')[0]);
};
</script>
