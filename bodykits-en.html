<script>
/**
 * 🛠️ KINGZCARBON 簡化外觀數據矩陣
 */
const bodyKitsDatabase = [
    { type: 'video', url: 'https://i.imgur.com/OWKM58C.mp4' },
    { type: 'video', url: 'https://i.imgur.com/CzT3FVY.mp4' },
    { type: 'video', url: 'https://i.imgur.com/lIweAMD.mp4' },
    { type: 'video', url: 'https://i.imgur.com/BqBmit2.mp4' },
    { type: 'image', url: 'https://i.imgur.com/DNeHanC.png' },
    { type: 'coming-soon', url: '' }
];

// 核心動態渲染中樞
function switchViewer(index, thumbElement) {
    const data = bodyKitsDatabase[index];
    if (!data) return;

    // 1. 同步更換縮圖高亮邊框
    const allThumbs = document.querySelectorAll('.paddle-thumb');
    allThumbs.forEach(thumb => thumb.classList.remove('active-thumb'));
    if (thumbElement) {
        thumbElement.classList.add('active-thumb');
    }

    const imgElement = document.getElementById('main-view-img');
    const videoElement = document.getElementById('main-view-video');
    const csOverlay = document.getElementById('coming-soon-overlay');
    const btnLink = document.getElementById('whatsapp-link');

    // 2. 模式排他性控制流
    if (data.type === 'video') {
        csOverlay.classList.add('hidden');
        imgElement.classList.add('hidden');
        imgElement.src = "";
        
        videoElement.src = data.url;
        videoElement.classList.remove('hidden');
        videoElement.load();
        videoElement.play().catch(e => console.log("Stream initialize: ", e));
        
        btnLink.style.opacity = "1";
        btnLink.style.pointerEvents = "auto";
    } else if (data.type === 'image') {
        csOverlay.classList.add('hidden');
        videoElement.classList.add('hidden');
        videoElement.pause();
        videoElement.src = "";
        
        imgElement.src = data.url;
        imgElement.classList.remove('hidden');
        
        btnLink.style.opacity = "1";
        btnLink.style.pointerEvents = "auto";
    } else if (data.type === 'coming-soon') {
        // 如果是第六格 Coming Soon, 隱藏所有影音，並秀出 Coming Soon Overlay 覆蓋層
        videoElement.classList.add('hidden');
        videoElement.pause();
        videoElement.src = "";
        imgElement.classList.add('hidden');
        imgElement.src = "";
        
        csOverlay.classList.remove('hidden');
        
        // 降低按鈕明度，使其不可點擊
        btnLink.style.opacity = "0.3";
        btnLink.style.pointerEvents = "none";
    }
}

// 初始化預設觸發第 0 位（即第一個高端影片案例）
window.onload = function() {
    switchViewer(0, document.querySelectorAll('.paddle-thumb')[0]);
};
</script>
